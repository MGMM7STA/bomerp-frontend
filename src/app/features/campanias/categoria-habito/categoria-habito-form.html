<section class="ss-pagina">
  <header class="ss-cabecera">
    <div>
      <span class="ss-eyebrow">Campañas · Categorías de hábito</span>
      <h1 class="ss-titulo">{{ id() ? 'Editar categoría' : 'Nueva categoría' }}</h1>
      <p class="ss-descripcion">Las categorías agrupan los hábitos que suman puntaje en la campaña.</p>
    </div>
  </header>

  <div class="ss-tarjeta">
    <form class="ss-form" [formGroup]="form" (ngSubmit)="guardar()">
      @if (loading()) {
        <p class="ss-descripcion">Cargando...</p>
      }

      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput type="text" formControlName="nombre" />
      </mat-form-field>
      <app-mensaje-error [texto]="mensajeValidacion('nombre')" />

      <mat-form-field>
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion"></textarea>
      </mat-form-field>
      <app-mensaje-error [texto]="mensajeValidacion('descripcion')" />

      <app-mensaje-error [texto]="error()" />

      <div class="ss-form-pie">
        <button class="ss-btn ss-btn-primario" type="submit" [disabled]="loading() || errorCarga()">Guardar</button>
        <button class="ss-btn ss-btn-secundario" type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
</section>
