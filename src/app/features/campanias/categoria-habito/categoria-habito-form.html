<h2>{{ id() ? 'Editar categoria de habito' : 'Nueva categoria de habito' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  @if (loading()) {
    <p>Cargando...</p>
  }

  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput type="text" formControlName="nombre" />
  </mat-form-field>
  <app-mensaje-error [texto]="mensajeValidacion('nombre')" />

  <mat-form-field>
    <mat-label>Descripcion</mat-label>
    <textarea matInput formControlName="descripcion"></textarea>
  </mat-form-field>
  <app-mensaje-error [texto]="mensajeValidacion('descripcion')" />

  <app-mensaje-error [texto]="error()" />

  <button matButton="filled" type="submit" [disabled]="loading() || errorCarga()">Guardar</button>
  <button matButton type="button" (click)="cancelar()">Cancelar</button>
</form>
